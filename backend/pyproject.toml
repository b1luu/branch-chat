[project]
name = "branch-chat-backend"
version = "0.1.0"
description = "Branch Chat API: a tree of chats backed by FastAPI."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "ollama: real-model tests against a local Ollama; auto-skipped when unreachable",
]

[tool.ruff.lint.isort]
# The local alembic/ migrations dir would otherwise make ruff treat `alembic` as first-party.
known-third-party = ["alembic"]
