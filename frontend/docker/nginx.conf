# Serves the built SPA and proxies the API, so the browser sees one origin
# (same as the Vite dev proxy: no CORS needed).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE: forward tokens as they arrive instead of buffering the whole reply.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location = /healthz {
        proxy_pass http://api:8000;
    }

    # Client-side app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
